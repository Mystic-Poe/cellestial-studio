<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="s00-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5ef2d6" stop-opacity=".5"/>
      <stop offset=".3" stop-color="#5ef2d6" stop-opacity=".14"/>
      <stop offset="1" stop-color="#5ef2d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s00-ray" gradientUnits="userSpaceOnUse" cx="64" cy="64" r="58">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".3" stop-color="#e6fffa"/>
      <stop offset="1" stop-color="#5ef2d6"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="64" r="64" fill="url(#s00-glow)"/>
  <!-- short diagonal rays -->
  <path d="M64 36 C65.12 60.80 67.20 62.88 92.00 64.00 C67.20 65.12 65.12 67.20 64.00 92.00 C62.88 67.20 60.80 65.12 36.00 64.00 C60.80 62.88 62.88 60.80 64.00 36.00Z"
        transform="rotate(45 64 64)" fill="#5ef2d6" fill-opacity=".9"/>
  <!-- long cardinal rays -->
  <path d="M64 6 C66.45 57.00 71.00 61.55 122.00 64.00 C71.00 66.45 66.45 71.00 64.00 122.00 C61.55 71.00 57.00 66.45 6.00 64.00 C57.00 61.55 61.55 57.00 64.00 6.00Z" fill="url(#s00-ray)"/>
  <!-- the cell: origin-node membrane, broken where the rays cross -->
  <circle cx="64" cy="64" r="30" fill="none" stroke="#5ef2d6" stroke-width="1.5" stroke-opacity=".75"
          stroke-linecap="round" stroke-dasharray="37.12 10" stroke-dashoffset="-5" transform="rotate(-90 64 64)"/>
  <circle cx="64" cy="64" r="5.5" fill="#ffffff"/>
</svg>
